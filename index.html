// ---------- live services (YouTube) ----------
// A GitHub job checks each church's YouTube channel every few minutes and writes live.json.
// The site reads it and shows the live service on the home page, a live bar on every page,
// and a pop-up nudging visitors on other churches' pages toward the church that is live.
let liveData=null, liveDemo=false, livePlaying="", liveSig="";
const LIVE_KEY="am-live-seen";
let liveSeen=[];try{liveSeen=JSON.parse(sessionStorage.getItem(LIVE_KEY)||"[]")}catch(e){}
function liveList(c){
  const d=liveDemo?{updated:new Date().toISOString(),live:{newark:{videoId:"EWoRU_NWXyg",title:"Culto ao vivo (demonstração)",started:new Date(Date.now()-25*60000).toISOString()}}}:liveData;
  if(!d||!d.live)return[];
  if(!liveDemo&&d.updated&&Date.now()-Date.parse(d.updated)>45*60000)return[];
  const L=locsOf(c);
  return Object.entries(d.live).map(([id,v])=>{const loc=L.find(l=>l.id===id);return loc&&v&&v.videoId?Object.assign({loc},v):null}).filter(Boolean);
}
const ytThumb=id=>`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
const ytWatch=id=>`https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
function sinceText(iso){const t=Date.parse(iso||"");if(!t)return"";const m=Math.max(1,Math.round((Date.now()-t)/60000));return m<60?`começou há ${m} min`:`começou há ${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`}
function liveBar(c){
  const ls=liveList(c);if(!ls.length)return"";
  const here=ls.find(x=>x.loc.id===c.loc.id);
  return `<div class="lv-bar" role="status"><div class="inner"><span class="lv-dot" aria-hidden="true"></span><b>AO VIVO AGORA</b>
    <div class="lv-chips">${ls.map(x=>`<button data-live-go="${esc(x.loc.id)}" class="${x.loc.id===c.loc.id?"on":""}"><span>${esc(x.loc.short||x.loc.label)}</span><small>${esc(x.title||"Culto ao vivo")}</small></button>`).join("")}</div>
    <button class="lv-cta" data-live-go="${esc((here||ls[0]).loc.id)}">Assistir ▶</button></div></div>`;
}
function livePlayer(x,big){
  const id=x.videoId, on=dock.id===id;
  return `<div class="lv-player ${big?"big":""}" data-vid="${esc(id)}">${on?`<button class="lv-face" data-live-play="${esc(id)}" aria-label="Voltar para o player"><img src="${ytThumb(id)}" alt="" loading="lazy"><span class="lv-badge"><i></i>TOCANDO</span><span class="lv-play">⤢</span></button>`
    :`<button class="lv-face" data-live-play="${esc(id)}" aria-label="Assistir ${esc(x.title||"culto")} ao vivo aqui"><img src="${ytThumb(id)}" alt="" loading="lazy"><span class="lv-badge"><i></i>AO VIVO</span><span class="lv-play">▶</span></button>`}</div>`;
}
function liveSection(c){
  const ls=liveList(c);if(!ls.length)return"";
  const here=ls.find(x=>x.loc.id===c.loc.id), others=ls.filter(x=>x!==here);
  return `<section class="s-block lv-sec" id="aovivo"><div class="inner">
    ${here?`<div class="lv-main card">
      ${livePlayer(here,true)}
      <div class="lv-info"><p class="s-kicker"><span class="lv-dot" aria-hidden="true"></span> Ao vivo agora · ${esc(here.loc.short||here.loc.label)}</p>
        <h3>${esc(here.title||"Culto ao vivo")}</h3><p class="lv-since">${esc(sinceText(here.started))}</p>
        <div class="s-btns"><button class="s-cta" data-live-play="${esc(here.videoId)}">Assistir aqui com o chat</button><a class="s-cta alt" href="${ytWatch(here.videoId)}" target="_blank" rel="noopener">Abrir no YouTube</a></div>
        <p class="lv-note">Comente, compartilhe e convide alguém para assistir com você.</p></div>
    </div>`:`<div class="s-hd"><div><p class="s-kicker"><span class="lv-dot" aria-hidden="true"></span> Ao vivo agora</p><h3>${others.length>1?"Nossas igrejas estão ao vivo":`${esc(others[0].loc.short||others[0].loc.label)} está ao vivo`}</h3><p>Entre agora e acompanhe o culto com a nossa família.</p></div></div>`}
    ${others.length?`${here?`<h4 class="lv-also">Também ao vivo agora</h4>`:""}<div class="lv-grid">${others.map(x=>`<article class="lv-card card">
      <button class="lv-face" data-live-go="${esc(x.loc.id)}" aria-label="Ir para ${esc(x.loc.short||x.loc.label)} ao vivo"><img src="${ytThumb(x.videoId)}" alt="" loading="lazy"><span class="lv-badge"><i></i>AO VIVO</span><span class="lv-play">▶</span></button>
      <div class="lv-ci"><b>${esc(x.loc.short||x.loc.label)}</b><span>${esc(x.title||"Culto ao vivo")}</span><small>${esc(sinceText(x.started))}</small>
      <div class="mini-actions"><button class="mini" data-live-go="${esc(x.loc.id)}">Ver na página de ${esc(x.loc.short||x.loc.label)}</button><a class="mini" href="${ytWatch(x.videoId)}" target="_blank" rel="noopener">YouTube</a></div></div>
    </article>`).join("")}</div>`:""}
  </div></section>`;
}
function liveNudge(c){
  const x=liveList(c).find(v=>v.loc.id!==c.loc.id&&!liveSeen.includes(v.videoId));
  if(!x||lightbox||profileOpen||bagOpen||dock.id)return"";
  return `<aside class="lv-pop" role="dialog" aria-label="${esc(x.loc.short||x.loc.label)} está ao vivo">
    <button class="lv-x" data-live-x="${esc(x.videoId)}" aria-label="Fechar">✕</button>
    <button class="lv-face" data-live-go="${esc(x.loc.id)}" aria-label="Assistir"><img src="${ytThumb(x.videoId)}" alt=""><span class="lv-badge"><i></i>AO VIVO</span></button>
    <div><b>${esc(x.loc.short||x.loc.label)} está ao vivo agora</b><span>${esc(x.title||"Culto ao vivo")}</span>
    <div class="lv-pop-b"><button class="s-cta" data-live-go="${esc(x.loc.id)}">Assistir agora</button><button class="lv-later" data-live-x="${esc(x.videoId)}">Agora não</button></div></div>
  </aside>`;
}
function liveClick(e){
  const g=e.target.closest("[data-live-go]");
  if(g){const id=g.dataset.liveGo;const all=liveList(current()),x=all.find(v=>v.loc.id===id);all.forEach(v=>{if(!liveSeen.includes(v.videoId))liveSeen.push(v.videoId)});try{sessionStorage.setItem(LIVE_KEY,JSON.stringify(liveSeen))}catch(err){}
    if(id!==getLoc(current()).id)setLoc(id);go("inicio",{to:"aovivo"});if(x){livePlaying=x.videoId;openDock(x.videoId,"big")}return true}
  const p=e.target.closest("[data-live-play]");
  if(p){livePlaying=p.dataset.livePlay;openDock(livePlaying,"big");return true}
  const x=e.target.closest("[data-live-x]");
  if(x){liveSeen.push(x.dataset.liveX);try{sessionStorage.setItem(LIVE_KEY,JSON.stringify(liveSeen))}catch(err){}renderSite(current());return true}
  return false;
}
async function pollLive(){
  const url=(current().liveFeed||"").trim();
  if(url){try{
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Math.floor(Date.now()/60000),{cache:"no-store"});
    if(r.ok){const d=await r.json();const sig=JSON.stringify(d&&d.live||{});
      if(sig!==liveSig){liveSig=sig;liveData=d;
        renderSite(current());if(dock.id&&dock.mode==="mini")renderDock()}
      else liveData=d}
  }catch(e){}}
  setTimeout(pollLive,60000);
}

  const hideKids=(boxId,arr,ok)=>{const b=$(boxId);if(!b)return;[...b.children].forEach((el,i)=>{el.classList.toggle("lock-hide",sc&&arr[i]!==undefined&&!ok(arr[i]))})};
  hideKids("locs-ed",draft.locations||[],l=>l.id===id);
  hideKids("staff-ed",draft.staff||[],p=>onlyLoc(p.locs,id)||!(live.staff||[]).some(x=>x.id===p.id));
  hideKids("albums",draft.albums||[],a=>a.loc===id);
  hideKids("list-events",draft.events||[],e=>e.loc===id);
  for(const x of["add-loc","f-defaultLoc"]){const el=$(x);if(el)(el.closest(".field")||el).classList.toggle("lock-hide",sc)}
  const sel=$("sc-loc");if(sel){[...sel.options].forEach(o=>{o.hidden=sc&&o.value!==id});if(sc&&sel.value!==id&&[...sel.options].some(o=>o.value===id)){sel.value=id;sel.dispatchEvent(new Event("change",{bubbles:true}))}}
}
function watchScope(){
  if(lockObs)return;
  lockObs=new MutationObserver(()=>{clearTimeout(lockTimer);lockTimer=setTimeout(applyScopeUI,30)});
  lockObs.observe($("manager"),{childList:true,subtree:true});
  $("manager").addEventListener("click",async e=>{
    if(e.target.id==="lock-open"){const k=lockCfg(),inp=$("lock-pin");if(!k||!inp)return;
      const h=await pinHash(inp.value.trim(),k.salt);
      if(h===k.hash){ownerOk=true;try{sessionStorage.setItem(OWNER_KEY,h)}catch(err){}toast("Owner mode: full access in this tab");applyScopeUI()}
      else{inp.value="";toast("Wrong PIN")}}
    if(e.target.id==="lock-close"){ownerOk=false;try{sessionStorage.removeItem(OWNER_KEY)}catch(err){}draft=clone(live);fillManager();renderSite(draft);applyScopeUI();toast("Locked again")}
  });
  $("manager").addEventListener("keydown",e=>{if(e.target.id==="lock-pin"&&e.key==="Enter")$("lock-open").click()});
  applyScopeUI();
}
function fillLockEditor(){
  const sel=$("f-lockLoc");if(!sel)return;
  const cur=(draft.editLock&&draft.editLock.loc)||"";
  sel.innerHTML=`<option value="">Off: anyone in the manager can edit everything</option>`+(draft.locations||[]).map(l=>`<option value="${esc(l.id)}" ${cur===l.id?"selected":""}>Limit editors to ${esc(l.short||l.label)}</option>`).join("");
  $("lock-pin-state").textContent=draft.editLock&&draft.editLock.hash?"An owner PIN is set.":"No owner PIN set yet.";
}

// ---------- start ----------
view=viewFromHash();
renderSite(live);
startTranslate();
pollLive();
(async()=>{
  const use=n=>window.claude?.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  const user=await use("user");
  const editor=user?await user.canEdit().catch(()=>false):false;
  if(!editor)return;                    // visitors see only the website
  if(location.hash==="#site")return;    // website-only link, even for the owner
  art=await use("artifact");
  assets=await use("assets");
  setManagerMode();
  if(user.isOwner&&await Promise.resolve(user.isOwner()).catch(()=>false))startReqs();
  if(!art){$("pill").textContent="Preview only: publishing unavailable here";$("pill").className="pill"}
})();
</script>
