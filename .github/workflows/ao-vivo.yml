name: Ao vivo (YouTube)

# GitHub delays and skips frequent schedules on small repos, so instead of relying on
# a run every 5 minutes, each run keeps watching for ~50 minutes (checking every 90 s).
# Extra schedules cover the service windows (times below are UTC; ET = UTC-5 in winter, UTC-4 in summer):
#   Sunday morning  (Newark, Long Branch ~11:00 ET)     -> 14:00-18:00 UTC
#   Sunday evening  (South River ~19:00 ET)              -> 22:00-03:00 UTC
#   Wed/Thu/Fri evenings (Newark, South River, Long Branch ~20:00 ET) -> 23:00-04:00 UTC
# plus an hourly check at other times.
on:
  schedule:
    - cron: "*/10 14-17 * * 0"
    - cron: "*/10 22-23 * * 0"
    - cron: "*/10 0-3 * * 1"
    - cron: "*/10 23 * * 3,4,5"
    - cron: "*/10 0-3 * * 4,5,6"
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ao-vivo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Vigiar quem está ao vivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 50*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            python3 scripts/check_live.py || true
            if [ -n "$(git status --porcelain live.json)" ]; then
              git add live.json
              git commit -q -m "Atualiza status ao vivo"
              git push -q origin main || (git pull -q --rebase origin main && git push -q origin main) || true
            fi
            sleep 90
          done
