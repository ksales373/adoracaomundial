name: Ao vivo (YouTube)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ao-vivo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checar quem está ao vivo
        run: python3 scripts/check_live.py
      - name: Salvar status
        run: |
          if [ -n "$(git status --porcelain live.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live.json
            git commit -m "Atualiza status ao vivo"
            git pull --rebase -q origin main
            git push
          fi
