name: Avisos de alteração do site

# Every update to the public site opens a GitHub issue that mentions the owner,
# so he gets an email/app notification with what changed and which church it touched.
on:
  push:
    branches: [main]
    paths-ignore:
      - live.json

permissions:
  contents: read
  issues: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Montar relatório
        run: python3 scripts/change_report.py "${{ github.event.before }}" "${{ github.sha }}"
      - name: Enviar aviso ao dono
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: ${{ github.event.compare }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "@ksales373 o site público foi atualizado."
            echo
            echo "**Quem enviou:** $AUTHOR"
            echo "**Descrição:** $(printf '%s' "$MSG" | head -n 1)"
            cat report.md
            echo
            echo "[Ver todas as mudanças]($COMPARE)"
          } > body.md
          gh issue create --title "$(cat report_title.txt)" --body-file body.md
